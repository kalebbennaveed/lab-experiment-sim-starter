[project]
name = "lab-experiment-sim-starter"
version = "0.1.0"
description = "A Python quadrotor experiment starter with a live Lissajous tracking demo."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=2.0,<3"]

[project.scripts]
lab-demo = "lab_sim.server:main"
lab-sim = "lab_sim.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]

